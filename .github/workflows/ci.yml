name: comprehensive

on:
  push:
    branches: [main, ci/comprehensive]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: required-contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-ci.txt
      - name: Run warehouse contract tests
        run: pytest tests
      - name: Copy+validate portal
        run: bash portal/build.sh
