name: pages-sketch

# Sketch only. Deploy is gated (if: false). Do not enable GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "paper/FIGURE-INDEX.json"
      - "paper/summaries/**"
      - "paper/previews/**"
  pull_request:
    paths:
      - "portal/**"
      - "paper/FIGURE-INDEX.json"
      - "paper/summaries/**"
      - "paper/previews/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-sketch
  cancel-in-progress: true

jobs:
  build:
    name: validate-and-copy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install -r requirements-ci.txt
      - name: Build _site from portal (copy+validate, no PDF upload)
        run: bash portal/build.sh

  deploy:
    if: false
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages (gated)
        id: deployment
        run: echo "Pages deploy is disabled until an explicit enable."
